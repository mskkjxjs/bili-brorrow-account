name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"

      - name: Build extension archive
        shell: bash
        run: |
          zip -r "bili-brorrow-account-${GITHUB_REF_NAME}.zip" \
            manifest.json \
            auto-quality.js \
            background.js \
            playback-data.js \
            playback-settings.js \
            popup.css \
            popup.html \
            popup.js \
            vendor \
            icons

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "bili-brorrow-account-${GITHUB_REF_NAME}.zip" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
